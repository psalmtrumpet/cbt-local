version: '3.9'

services:
  # ── SQL Server ─────────────────────────────────────────────────────────────
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cbt_local_db
    environment:
      SA_PASSWORD: "${DB_SA_PASSWORD}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "127.0.0.1:14330:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - cbt_local_net
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${DB_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── CBT Web App ────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cbt_local_web
    ports:
      - "0.0.0.0:8080:8080"    # accessible to all devices on the local network
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=NcsCbtLocalDb;User Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Anthropic__ApiKey: "${ANTHROPIC_API_KEY}"
      Email__Smtp: "${SMTP_HOST}"
      Email__Port: "${SMTP_PORT}"
      Email__Username: "${SMTP_USERNAME}"
      Email__FromName: "${EMAIL_FROM_NAME}"
      Email__ExamUrl: "http://${LOCAL_IP}:8080"
      Email__Password: "${SMTP_PASSWORD}"
      AzureFace__Endpoint: "${AZURE_FACE_ENDPOINT}"
      AzureFace__Key: "${AZURE_FACE_KEY}"
    volumes:
      - dp_keys:/app/keys
    networks:
      - cbt_local_net
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

networks:
  cbt_local_net:
    driver: bridge

volumes:
  sqlserver_data:
    driver: local
  dp_keys:
    driver: local
