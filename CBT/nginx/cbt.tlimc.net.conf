# NCS CBT — cbt.tlimc.net
# Append this content into /opt/tagalong/nginx/nginx.conf on the VPS
# (inside the http {} block, after existing server blocks)

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name cbt.tlimc.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cbt.tlimc.net;

    # SSL
    ssl_certificate     /etc/letsencrypt/live/cbt.tlimc.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cbt.tlimc.net/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Logs
    access_log /var/log/nginx/cbt.tlimc.net.access.log;
    error_log  /var/log/nginx/cbt.tlimc.net.error.log;

    # ── Security Headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "SAMEORIGIN" always;
    add_header X-Content-Type-Options     "nosniff" always;
    add_header X-XSS-Protection           "1; mode=block" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    # Allow camera+mic only from the same origin (required for proctoring)
    add_header Permissions-Policy         "camera=(self), microphone=(self), geolocation=()" always;

    # Hide server version
    server_tokens off;

    # Upload size — 100 MB covers large recording chunks
    client_max_body_size 100M;

    # ── Block access to sensitive paths ──────────────────────────────────────
    location ~ /\. {
        deny all;
    }
    location ~* \.(env|json|config|yml|yaml|sh|sql|log)$ {
        deny all;
    }

    # ── SignalR WebSocket (examHub) ──────────────────────────────────────────
    location /examHub {
        proxy_pass         http://ncs_cbt_web:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Main App ─────────────────────────────────────────────────────────────
    location / {
        proxy_pass         http://ncs_cbt_web:8080;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
